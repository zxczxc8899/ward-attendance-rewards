 return wtabs("selW")+nav()+

function vCal(){

function ent(id,k){return nv((S.att[id]||{})[k])}
function pick(k){
 var es=ent(pid,k),tot=0,xs=S.exp.filter(function(e){return e.pid==pid&&e.date==k}),hn=hol(k);
 es.forEach(function(e){tot+=e.a});
 var ls=es.map(function(e,i){return '<div class="li"><span>적립 <b>'+won(e.a)+'</b></span><button class="sm dng" onclick="delE(\''+k+'\','+i+')">삭제</button></div>'}).join("");
 $("#md").innerHTML='<div class="ov" onclick="if(event.target==this)closeM()"><div class="sheet"><h3>'+esc(P(pid).name)+' · '+k.replace(/-/g,".")+'</h3><div class="mu">'+(hn?hn+' · ':'')+'이 날 적립 합계 <b class="bal">'+won(tot)+'</b></div>'+(ls||'<p class="mu">아직 적립이 없어요.</p>')+
 '<div class="opts"><button onclick="addE(\''+k+'\',100)">+100원</button><button class="b" onclick="addE(\''+k+'\',200)">+200원</button></div>'+
 (xs.length?'<div class="mu" style="margin-bottom:10px">이 날 지출: '+xs.map(function(e){return esc(e.memo||"지출")+' −'+won(e.amt)}).join(", ")+'</div>':'')+'<button style="width:100%" onclick="closeM()">닫기</button></div></div>';
}
function putE(k,es,open){var a=S.att[pid]||(S.att[pid]={});if(es.length)a[k]=es;else delete a[k];save();render();if(open)pick(k);else closeM()}
function addE(k,a){var es=ent(pid,k);es.push({a:a});putE(k,es,false)}
function delE(k,i){var es=ent(pid,k);es.splice(i,1);putE(k,es,true)}
function closeM(){$("#md").innerHTML=""}
function expCard(s){
 var pre=ms(Y,M),e=edit?S.exp.filter(function(x){return x.id==edit})[0]:null;
 var dflt=e?e.date:(now.getFullYear()==Y&&now.getMonth()==M?key(Y,M,now.getDate()):key(Y,M,1));
 var list=S.exp.filter(function(x){return x.pid==pid&&x.date.slice(0,7)==pre}).sort(function(a,b){return b.date<a.date?-1:1});
 return '<div class="card"><b>'+(e?"지출 수정":"물품 구매(지출) 등록")+'</b><div class="mu" style="margin:2px 0 8px">사용 가능한 잔액 <b class="bal">'+won(s.bal)+'</b></div><div class="row"><input type="date" id="ed" value="'+dflt+'"><input type="number" id="ea" inputmode="numeric" min="1" placeholder="금액(원)" value="'+(e?e.amt:"")+'"></div><input id="em" placeholder="물품 (간식, 음료, 문구류)" value="'+(e?esc(e.memo):"")+'" style="margin-bottom:8px"><div class="acts"><button class="pri" onclick="saveExp()">'+(e?"수정 저장":"추가")+'</button>'+(e?'<button onclick="edit=null;render()">취소</button>':"")+'</div><div id="er" class="mu" style="color:var(--dn);margin-top:6px"></div></div>'+
 '<div class="card"><b>'+(M+1)+'월 지출 '+won(s.sp)+'</b>'+(list.length?list.map(function(x){return '<div class="li"><div><b>'+esc(x.memo||"지출")+'</b><small>'+x.date.replace(/-/g,".")+' · '+(x.done?"지급완료 "+(x.dt||""):"미지급")+'</small></div><div class="acts" style="flex:none;align-items:center"><span>'+won(x.amt)+'</span><button class="sm" onclick="edit=\''+x.id+'\';render()">수정</button><button class="sm dng" onclick="delExp(\''+x.id+'\')">삭제</button></div></div>'}).join(""):'<p class="mu">이 달에 등록된 지출이 없어요.</p>')+'</div>';
}

 if(edit){S.exp.forEach(function(x){if(x.id==edit){x.date=d;x.amt=a;x.memo=m}});edit=null}
 else S.exp.push({id:uid("e"),pid:pid,date:d,amt:a,memo:m,done:false});

function ask(t,b,acts){
 $("#md").innerHTML='<div class="ov"><div class="sheet"><h3>'+t+'</h3><p class="mu">'+b+'</p><div class="acts">'+acts.map(function(a,i){return '<button class="'+a[1]+'" id="ak'+i+'">'+a[0]+'</button>'}).join("")+'</div></div></div>';

function gsh(n){var d=new Date(gd+"T00:00:00");d.setDate(d.getDate()+n);gd=key(d.getFullYear(),d.getMonth(),d.getDate());render()}
function giveT(id){S.exp.forEach(function(x){if(x.id==id){x.done=!x.done;var t=new Date();x.dt=x.done?pad(t.getHours())+":"+pad(t.getMinutes()):""}});save();render()}
function vGift(){
 var all=S.exp.filter(function(x){return x.date==gd&&P(x.pid)}),
 L=all.filter(function(x){return !gw||P(x.pid).ward==gw}).sort(function(a,b){var pa=P(a.pid),pb=P(b.pid);return pa.ward-pb.ward||pa.name.localeCompare(pb.name,"ko")}),
 tot=0,dn=0,g={};
 L.forEach(function(x){tot+=x.amt;if(x.done)dn++;var m=x.memo||"(항목 없음)",o=g[m]=g[m]||{n:0,a:0,d:0};o.n++;o.a+=x.amt;if(x.done)o.d++});
 var wb=[0,2,3,4,5].map(function(w){var c=all.filter(function(x){return !w||P(x.pid).ward==w}).length;return '<button class="'+(w==gw?"pri":"")+'" onclick="gw='+w+';render()" style="padding:10px 2px">'+(w?w+"병동":"전체")+'<br><small>'+c+'건</small></button>'}).join("");
 var rh=function(x){var p=P(x.pid);return '<label class="gi'+(x.done?" dn":"")+'"><input type="checkbox"'+(x.done?" checked":"")+' onchange="giveT(\''+x.id+'\')"><div><b class="gn">'+esc(p.name)+'</b> <small>'+p.ward+'병동</small><div class="gn">'+esc(x.memo||"(항목 없음)")+'</div>'+(x.done?'<small>지급 '+(x.dt||"")+'</small>':'')+'</div><b>'+won(x.amt)+'</b></label>'};
 var todo=L.filter(function(x){return !x.done}),dn2=L.filter(function(x){return x.done});
 var rows=todo.map(rh).join("")+(dn2.length?'<div class="mu" style="margin:14px 0 2px"><b>지급 완료 '+dn2.length+'건</b></div>'+dn2.map(rh).join(""):"");
 if(L.length&&!todo.length)rows='<p class="mu" style="margin:8px 0">모든 물품을 지급했어요.</p>'+rows;
 var gr=Object.keys(g).map(function(m){return '<tr><td>'+esc(m)+'</td><td>'+g[m].d+'/'+g[m].n+'건</td><td>'+won(g[m].a)+'</td></tr>'}).join("");
 return '<div class="nav"><button onclick="gsh(-1)" aria-label="전날">‹</button><div style="text-align:center"><b style="font-size:18px">'+gd.replace(/-/g,".")+' ('+DW[new Date(gd+"T00:00:00").getDay()]+')</b><div><button class="sm" onclick="gd=key(now.getFullYear(),now.getMonth(),now.getDate());render()">오늘</button></div></div><button onclick="gsh(1)" aria-label="다음날">›</button></div>'+
 '<div class="row" style="grid-template-columns:repeat(5,1fr)">'+wb+'</div>'+
 '<div class="card"><div class="st"><div><small>주문</small><b>'+L.length+'건</b></div><div><small>지급 완료</small><b class="bal">'+dn+'건</b></div><div><small>미지급</small><b style="color:var(--dn)">'+(L.length-dn)+'건</b></div><div><small>합계 금액</small><b>'+won(tot)+'</b></div></div></div>'+
 '<div class="card"><b>주문 목록</b><p class="mu" style="margin:2px 0">물건을 전달하고 체크하면 아래 "지급 완료"로 내려가요.</p>'+(rows||'<p class="mu">이 날 주문한 물품이 없어요. 달력 화면 아래에서 지출(물품 구매)을 등록하면 여기에 나타나요.</p>')+'</div>'+
 (gr?'<div class="card"><b>품목별 합계</b><div class="tw"><table class="tb"><tr><th>물품</th><th>지급/주문</th><th>금액</th></tr>'+gr+'</table></div></div>':'');
}
function td(){return key(now.getFullYear(),now.getMonth(),now.getDate())}
function adoc(x){return{pid:x.pid,date:x.date,amt:x.amt,memo:x.memo||""}}
function delAdj(id){ask("이월금액 삭제","이 이월금액 내역을 삭제할까요? 잔액이 다시 계산됩니다.",[["삭제","dng",function(){S.adj=S.adj.filter(function(x){return x.id!=id});save();closeM();render()}],["취소","",closeM]])}
function adjBox(){
 var l=S.adj.filter(function(a){var p=P(a.pid);return p&&p.ward==ward}).sort(function(a,b){return b.date<a.date?-1:1}),tot=0;
 l.forEach(function(a){tot+=a.amt});
 return '<details style="margin-top:14px;border-top:1px solid var(--ln);padding-top:4px"><summary>수기 이월금액 입력 (처음 1회)</summary><p class="mu">수기 장부에 적힌 금액을 이월금액으로 등록해요. 한 줄에 "이름 금액"을 붙여넣으세요. 예) 김민수 3000</p><input type="date" id="ad2" value="'+td()+'" style="margin-bottom:8px"><textarea id="ab" placeholder="김민수 3000&#10;이영희 1500"></textarea><label class="mu" style="display:block;margin:8px 0"><input type="checkbox" id="an" checked style="width:auto;padding:0"> 명단에 없는 이름은 환자로 새로 추가</label><button class="pri" style="width:100%" onclick="bulkAdj()">'+ward+'병동 이월금액 등록</button>'+(l.length?'<details style="margin-top:12px"><summary class="mu" style="font-weight:400">등록된 이월 내역 '+l.length+'건 · '+won(tot)+'</summary>'+l.map(function(a){var p=P(a.pid);return '<div class="li"><div><b>'+esc(p.name)+'</b><small>'+a.date.replace(/-/g,".")+(a.memo?" · "+esc(a.memo):"")+'</small></div><div class="acts" style="flex:none;align-items:center"><span>'+(a.amt>0?"+":"")+won(a.amt)+'</span><button class="sm dng" onclick="delAdj(\''+a.id+'\')">삭제</button></div></div>'}).join("")+'</details>':'')+'</details>';

function bulkAdj(){
 var d=$("#ad2").value,add=$("#an").checked,L=$("#ab").value.split("\n"),rows=[],bad=[],nw={},tot=0,cur=pats(ward);
 if(!d){ask("기준일 필요","기준일을 선택해 주세요.",[["확인","pri",closeM]]);return}
 L.forEach(function(l){l=l.trim();if(!l)return;
  var m=/^(.*?)[\s,]+(-?[\d,]+)\s*원?$/.exec(l),a=m?parseInt(m[2].replace(/,/g,""),10):0,n=m?m[1].trim():"";
  if(!m||!n||!a){bad.push(l);return}
  var p=cur.filter(function(x){return x.name==n})[0];
  if(!p&&!add){bad.push(l);return}
  if(!p)nw[n]=1;
  rows.push({n:n,a:a,p:p});tot+=a});
 if(!rows.length){ask("입력 내용 없음","읽을 수 있는 줄이 없어요. 한 줄에 한 명씩 '이름 금액'으로 입력해 주세요.",[["확인","pri",closeM]]);return}
 var nn=Object.keys(nw).length;
 ask("이월금액 등록 확인",ward+"병동 · 기준일 "+d.replace(/-/g,".")+"<br>이월금액 "+rows.length+"건, 합계 "+won(tot)+(nn?"<br>새로 추가될 환자 "+nn+"명":"")+(bad.length?"<br><b>읽지 못한 줄 "+bad.length+"개</b>는 건너뛰어요: "+esc(bad.slice(0,5).join(" / "))+(bad.length>5?" …":""):""),[
  ["등록","pri",function(){var made={};rows.forEach(function(r){var p=r.p||made[r.n];if(!p){p={id:uid("p"),ward:ward,name:r.n};S.patients.push(p);made[r.n]=p}S.adj.push({id:uid("a"),pid:p.id,date:d,amt:r.a,memo:"수기 이월"})});save();render();ask("등록 완료",rows.length+"건의 이월금액을 등록했어요. 달력 탭의 이월 금액에서 확인해 보세요.",[["확인","pri",closeM]])}],

function push(){
 if(!synced||!fdb)return;
 var base=fdb.collection("rooms").doc(room),ops=[],sp={},se={},sa={};
 S.patients.forEach(function(p){sp[p.id]=1;var d=pdoc(p),j=cj(d);if(cloud.p[p.id]!==j){ops.push(["s",base.collection("patients").doc(p.id),d]);cloud.p[p.id]=j}});
 Object.keys(cloud.p).forEach(function(i){if(!sp[i]){ops.push(["d",base.collection("patients").doc(i)]);delete cloud.p[i]}});
 S.exp.forEach(function(x){se[x.id]=1;var d=edoc(x),j=cj(d);if(cloud.e[x.id]!==j){ops.push(["s",base.collection("exps").doc(x.id),d]);cloud.e[x.id]=j}});
 Object.keys(cloud.e).forEach(function(i){if(!se[i]){ops.push(["d",base.collection("exps").doc(i)]);delete cloud.e[i]}});
 S.adj.forEach(function(x){sa[x.id]=1;var d=adoc(x),j=cj(d);if(cloud.a[x.id]!==j){ops.push(["s",base.collection("adjs").doc(x.id),d]);cloud.a[x.id]=j}});
 Object.keys(cloud.a).forEach(function(i){if(!sa[i]){ops.push(["d",base.collection("adjs").doc(i)]);delete cloud.a[i]}});
 for(var o=0;o<ops.length;o+=400){var b=fdb.batch();ops.slice(o,o+400).forEach(function(t){if(t[0]=="s")b.set(t[1],t[2]);else b.delete(t[1])});b.commit().catch(function(e){setSt("저장 실패: "+(e.code||e.message))})}
}
function saveCfg(){
 var t=$("#fc").value,o={},m,re=/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g;
 while((m=re.exec(t)))o[m[1]]=m[2];
 if(!o.apiKey||!o.projectId){setSt("apiKey와 projectId가 보이지 않아요. firebaseConfig 전체를 붙여넣어 주세요.");return}
 try{localStorage.setItem(CK,JSON.stringify(o))}catch(e){}
 rr();
}
function clrCfg(){try{localStorage.removeItem(CK)}catch(e){}rr()}
function connect(){
 var c=$("#fk").value.trim();
 if(c.length<8){setSt("공유 코드는 8자 이상으로 입력해 주세요. 길수록 안전해요.");return}
 if(/[\/\s]/.test(c)||/^__/.test(c)||/^\.+$/.test(c)){setSt("공유 코드에는 공백과 / 를 쓸 수 없어요.");return}
 detach();room=c;decided=false;
 try{localStorage.setItem(RK2,c);localStorage.setItem(SYK,"0")}catch(e){}
 startSync();rr();
}
function fbOut(){try{localStorage.setItem(SYK,"0");localStorage.removeItem(RK2)}catch(e){}room="";decided=false;detach();setSt("");rr()}
function fbCard(){
 var cfg=getCfg(),h='<div class="card"><b>실시간 공유 (Firebase)</b>';
 if(!cfg)return h+'<p class="mu">여러 기기에서 같은 데이터를 함께 보고 수정하려면 Firebase 설정값(firebaseConfig)이 필요해요. Firebase 콘솔에서 복사해 붙여넣으세요.</p><textarea id="fc" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ..., appId: ... };"></textarea><button class="pri" style="margin-top:8px" onclick="saveCfg()">설정값 저장</button><div id="fbs" class="mu" style="margin-top:6px">'+esc(fstate)+'</div></div>';
 if(isAuto())return h+'<p class="mu">자동으로 연결돼요. 이 주소를 연 모든 기기가 같은 데이터를 실시간으로 공유해요. 따로 입력할 코드는 없어요.</p><div id="fbs" class="mu" style="margin-top:6px">'+esc(fstate)+'</div></div>';
 if(!room)return h+'<p class="mu">로그인 없이 <b>공유 코드</b>가 같은 기기끼리 데이터를 공유해요. 길고 추측하기 어려운 코드를 정하고(예: 영문+숫자 16자 이상), 담당자들에게만 알려주세요.</p><input id="fk" placeholder="공유 코드 (8자 이상)" autocomplete="off" style="margin-bottom:8px"><div class="acts"><button class="pri" onclick="connect()">연결</button>'+(FB_CONFIG?'':'<button onclick="clrCfg()">설정값 지우기</button>')+'</div><div id="fbs" class="mu" style="margin-top:6px">'+esc(fstate)+'</div></div>';
 return h+'<p class="mu">공유 코드 '+esc(room.slice(0,3))+'••• 로 연결돼 있어요. 같은 코드를 입력한 기기와 데이터가 실시간으로 공유돼요.</p><div class="acts"><button class="dng" onclick="fbOut()">공유 끄기</button></div><div id="fbs" class="mu" style="margin-top:6px">'+esc(fstate)+'</div></div>';
}
setSt("");if(getCfg()&&room)startSync();
var swX=0,swY=0,swOn=false;
$("#v").addEventListener("touchstart",function(e){var t=e.touches[0];swX=t.clientX;swY=t.clientY;swOn=e.touches.length==1&&!!e.target.closest(".swp")},{passive:true});
$("#v").addEventListener("touchend",function(e){if(!swOn)return;swOn=false;var t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;if(tab=="cal"&&P(pid)&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)},{passive:true});
</script></body></html>
