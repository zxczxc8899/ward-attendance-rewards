<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병동 출석 리워드</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f1;--sf:#fff;--tx:#1e2a22;--mu:#6b7a70;--ln:#dde5dc;--ac:#2f7d57;--a1:#cfe9d9;--bl:#2f6fe0;--dn:#c4452f;--rd:#fdeceb;--ac-tx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--sf:#1b261f;--tx:#e8f0ea;--mu:#8fa196;--ln:#2b3a30;--ac:#5fc08b;--a1:#24402f;--bl:#3c6fd1;--dn:#ef7d68;--rd:#3a2523;--ac-tx:#0d1a12}}
:root[data-theme="dark"]{--bg:#121a15;--sf:#1b261f;--tx:#e8f0ea;--mu:#8fa196;--ln:#2b3a30;--ac:#5fc08b;--a1:#24402f;--bl:#3c6fd1;--dn:#ef7d68;--rd:#3a2523;--ac-tx:#0d1a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.45}
.app{max-width:760px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:18px;margin:6px 0 10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:600}
.dng{color:var(--dn);border-color:var(--dn)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 2px;min-width:0}
.sum small{display:block;color:var(--mu);font-size:11px}
.sum span{font-weight:700;font-size:14px}
.sum em{display:block;font-style:normal;font-size:10px;color:var(--dn);margin-top:2px}
.bal{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.dow:first-child,.dow:last-child{color:var(--dn)}
.day{min-height:66px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:13px;min-width:0}
.day.e{visibility:hidden}
.day.off{background:var(--rd);border-color:var(--rd)}
.day.today{outline:2px solid var(--tx)}
.dh{min-width:0;max-width:100%;text-align:left}
.dh span{display:block}
.off .dh span{color:var(--dn)}
.hn{display:block;font-style:normal;font-size:9px;color:var(--dn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{display:flex;flex-direction:column;align-items:flex-end;align-self:flex-end;gap:2px}
.it i{font-style:normal;font-size:10px;font-weight:700;border-radius:6px;padding:0 4px;white-space:nowrap}
.c1{background:var(--a1)}.c2{background:var(--bl);color:#fff}
.it u{text-decoration:none;font-size:10px;font-weight:700;border:1px solid var(--dn);color:var(--dn);border-radius:6px;padding:0 4px;background:var(--sf)}
.lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mu)}
.lg b{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{display:flex;max-width:760px;width:100%}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:14px 2px;color:var(--mu)}
.tabs button.on{color:var(--ac);font-weight:700}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
textarea{min-height:90px;font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}
.li small{color:var(--mu);display:block}
.mu{color:var(--mu);font-size:13px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st div{background:var(--bg);border-radius:10px;padding:10px}
.st small{color:var(--mu);display:block;font-size:12px}
.st b{font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--sf);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 6px}
.opts{display:flex;gap:8px;margin:10px 0}.opts button{flex:1;padding:16px 4px;font-weight:700;background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.opts button.b{background:var(--bl);border-color:var(--bl);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts button{flex:1}
.wt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.wt button{padding:10px 2px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.wt button small{font-weight:400;font-size:11px;opacity:.8}
.wt button.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.pi{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--ln);padding:4px 0}
.pi.on{background:var(--a1)}
.pn{flex:1;display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:8px 4px;min-width:0}
.pn small{display:block;color:var(--mu);font-weight:400}
.sm{padding:6px 9px;font-size:12px}
.pt{display:flex;align-items:center;gap:8px;padding:10px}
.pt div{flex:1;text-align:center}.pt small{display:block;color:var(--mu)}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--mu);font-weight:500}
.tb tr.tot td{font-weight:700}
.gi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.gi input{width:26px;height:26px;flex:none;padding:0;accent-color:var(--ac)}
.gi>div{flex:1;min-width:0}
.gi small{color:var(--mu)}
.gi.dn{opacity:.55}.gi.dn .gn{text-decoration:line-through}
details summary{cursor:pointer;font-weight:600;margin:10px 0}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}.day{font-size:15px;min-height:80px}.it i,.it u{font-size:12px}.hn{font-size:11px}}
</style></head><body>
<div class="app"><h1>병동 출석 리워드</h1><div id="v"></div></div>
<div class="tabs"><div id="tb"></div></div>
<div id="md"></div>
<script>
var KEY="attend-reward-v2",SK="attend-sort",S=null,tab="cal",sv="w",sortM="n",ward=2,pid=null,q="",edit=null,now=new Date(),Y=now.getFullYear(),M=now.getMonth();
var $=function(s){return document.querySelector(s)};
var pad=function(n){return(n<10?"0":"")+n};
var key=function(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)};
var won=function(n){return n.toLocaleString("ko-KR")+"원"};
var ms=function(y,m){return y+"-"+pad(m+1)};
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var DW=["일","월","화","수","목","금","토"];
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var HD={2025:"0101신정 0127임시휴일 0128설날 0129설날 0130설날 0301삼일절 0303대체휴일 0505어린이날 0506대체휴일 0603대선 0606현충일 0815광복절 1003개천절 1005추석 1006추석 1007추석 1008대체휴일 1009한글날 1225성탄절",
2026:"0101신정 0216설날 0217설날 0218설날 0301삼일절 0302대체휴일 0501노동절 0505어린이날 0524석가탄신일 0525대체휴일 0603지방선거 0606현충일 0717제헌절 0815광복절 0817대체휴일 0924추석 0925추석 0926추석 1003개천절 1005대체휴일 1009한글날 1225성탄절",
2027:"0101신정 0206설날 0207설날 0208설날 0209대체휴일 0301삼일절 0501노동절 0503대체휴일 0505어린이날 0513석가탄신일 0606현충일 0717제헌절 0719대체휴일 0815광복절 0816대체휴일 0914추석 0915추석 0916추석 1003개천절 1004대체휴일 1009한글날 1011대체휴일 1225성탄절 1227대체휴일"};
var HOL={};for(var hy in HD)HD[hy].split(" ").forEach(function(t){HOL[hy+"-"+t.slice(0,2)+"-"+t.slice(2,4)]=t.slice(4)});
try{var raw=localStorage.getItem(KEY);if(raw){var p0=JSON.parse(raw);if(p0&&p0.patients&&p0.att&&p0.exp)S=p0}}catch(e){}
try{if(localStorage.getItem(SK)=="f")sortM="f"}catch(e){}
var gd=key(now.getFullYear(),now.getMonth(),now.getDate()),gw=2;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function nv(v){return Array.isArray(v)?v.slice():(v>0?[{a:v}]:[])}
function P(id){return S.patients.filter(function(p){return p.id==id})[0]}
function pats(w){return S.patients.filter(function(p){return p.ward==w}).sort(function(a,b){return a.name.localeCompare(b.name,"ko")})}
function plist(w){var l=pats(w);if(sortM=="f"){var d={};l.forEach(function(p){d[p.id]=stats(p.id,Y,M).days});l=l.sort(function(a,b){return d[b.id]-d[a.id]||a.name.localeCompare(b.name,"ko")})}return l}
function ensureP(){var need=!P(pid)||((tab=="cal"||tab=="stat")&&P(pid).ward!=ward);if(need){var l=plist(ward);pid=l.length?l[0].id:null}}
function seed(){
 var N={2:["김민수","이영희","박철수"],3:["최지은","정우성","한소희"],4:["강동원","윤서연","임도현"],5:["오세진","신하늘","배준호"]};
 for(var w in N)N[w].forEach(function(n){S.patients.push({id:uid("p"),ward:+w,name:n})});
 var id=S.patients[0].id,a=S.att[id]={},pm=new Date(now.getFullYear(),now.getMonth()-1,1);
 for(var d=1;d<=10;d++)a[key(pm.getFullYear(),pm.getMonth(),d)]=[{a:d%2?100:200}];
 a[key(Y,M,1)]=[{a:100},{a:200}];a[key(Y,M,2)]=[{a:100}];a[key(Y,M,3)]=[{a:200}];
 S.exp.push({id:uid("e"),pid:id,date:key(Y,M,2),amt:1800,memo:"간식 (예시)",done:true,dt:"10:00"});
 S.exp.push({id:uid("e"),pid:S.patients[1].id,date:gd,amt:700,memo:"음료 (예시)",done:false});
}
if(!S){S={patients:[],att:{},exp:[]};seed();save()}
function stats(id,y,m){
 var pre=ms(y,m),a=S.att[id]||{},carry=0,rew=0,sp=0,c1=0,c2=0,days=0,ta=0,te=0;
 for(var k in a){var es=nv(a[k]),t=0;es.forEach(function(e){t+=e.a});ta+=t;var mk=k.slice(0,7);
  if(mk<pre)carry+=t;else if(mk==pre){rew+=t;if(t>0)days++;es.forEach(function(e){e.a==100?c1++:c2++})}}
 S.exp.forEach(function(e){if(e.pid!=id)return;te+=e.amt;var mk=e.date.slice(0,7);if(mk<pre)carry-=e.amt;else if(mk==pre)sp+=e.amt});
 var fc=Math.min(sp,Math.max(carry,0)),fr=sp-fc;
 return{carry:carry,rew:rew,sp:sp,fc:fc,fr:fr,cl:carry-fc,rl:rew-fr,bal:carry+rew-sp,c1:c1,c2:c2,days:days,ta:ta,te:te};
}
function go(d){M+=d;if(M<0){M=11;Y--}if(M>11){M=0;Y++}render()}
function nav(){return '<div class="nav"><button onclick="go(-1)" aria-label="이전 달">‹</button><b>'+Y+'년 '+(M+1)+'월</b><button onclick="go(1)" aria-label="다음 달">›</button></div>'}
function hdr(){var p=P(pid);return '<div class="card pt"><button onclick="step(-1)" aria-label="이전 환자">‹</button><div><b style="font-size:18px">'+esc(p.name)+'</b><small>'+p.ward+'병동</small></div><button onclick="step(1)" aria-label="다음 환자">›</button><button onclick="ward=P(pid).ward;tab=\'list\';render()">환자 목록</button></div>'}
function step(d){var l=plist(P(pid).ward),i=l.findIndex(function(p){return p.id==pid});pid=l[(i+d+l.length)%l.length].id;render()}
function summary(s){
 return '<div class="sum"><div><small>이월</small><span>'+won(s.cl)+'</span>'+(s.fc?'<em>'+won(s.carry)+' 중 −'+won(s.fc)+'</em>':'')+'</div>'+
 '<div><small>이번 달 적립</small><span>'+won(s.rl)+'</span>'+(s.fr?'<em>'+won(s.rew)+' 중 −'+won(s.fr)+'</em>':'')+'</div>'+
 '<div><small>지출</small><span>'+won(s.sp)+'</span></div><div><small>잔액</small><span class="bal">'+won(s.bal)+'</span></div></div>'+
 (s.sp?'<p class="mu" style="margin:8px 0 0">지출은 이월금액에서 먼저 차감하고, 부족하면 이번 달 적립에서 차감해요.</p>':'');
}
function noP(){return '<div class="card"><p>'+ward+'병동에 등록된 환자가 없어요. 병동 탭에서 환자를 추가해 주세요.</p><button class="pri" onclick="tab=\'list\';render()">병동 탭으로</button></div>'}
function render(){
 ensureP();
 var T=[["list","병동"],["cal","달력"],["gift","물품지급"],["stat","통계"],["set","설정"]],h;
 $("#tb").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("");
 if(tab=="list")h=vList();else if(tab=="set")h=vSet();else if(tab=="stat")h=vStat();else if(tab=="gift")h=vGift();
 else h=P(pid)?vCal():wtabs("selW")+noP();
 $("#v").innerHTML=h;
 if(tab=="list")fl();if(tab=="set")bk();
}
function setSort(m){sortM=m;try{localStorage.setItem(SK,m)}catch(e){}render()}
function wtabs(fn){return '<div class="wt">'+[2,3,4,5].map(function(w){return '<button class="'+(w==ward?"on":"")+'" onclick="'+fn+'('+w+')">'+w+'병동<small>'+pats(w).length+'명</small></button>'}).join("")+'</div>'}
function selW(w){ward=w;gw=w;q="";render()}
function vList(){
 return wtabs("selW")+nav()+
 '<div class="card"><input id="q" placeholder="'+ward+'병동 환자 이름 검색" oninput="q=this.value;fl()" value="'+esc(q)+'"><div class="row" style="margin:8px 0 0"><button class="'+(sortM=="n"?"pri":"")+'" onclick="setSort(\'n\')">이름순 (가나다)</button><button class="'+(sortM=="f"?"pri":"")+'" onclick="setSort(\'f\')">참여빈도순</button></div><details><summary>'+ward+'병동에 환자 추가</summary><textarea id="pb" placeholder="이름을 한 줄에 한 명씩 입력하세요 (여러 명 한꺼번에 가능)"></textarea><button class="pri" style="margin-top:8px" onclick="addPats()">추가</button></details><div id="pl"></div></div>';
}
function fl(){
 var l=plist(ward).filter(function(p){return p.name.indexOf(q.trim())>-1}),tot=0;
 var h=l.map(function(p){var s=stats(p.id,Y,M);tot+=s.bal;return '<div class="pi '+(p.id==pid?"on":"")+'"><button class="pn" onclick="pid=\''+p.id+'\';tab=\'cal\';render()"><div><b>'+esc(p.name)+'</b><small>'+(M+1)+'월 출석 '+s.days+'일</small></div><b class="bal">'+won(s.bal)+'</b></button><button class="sm" onclick="editPat(\''+p.id+'\')">수정</button><button class="sm dng" onclick="delPat(\''+p.id+'\')">삭제</button></div>'}).join("");
 $("#pl").innerHTML='<div class="mu" style="margin:6px 0">'+l.length+'명 · 잔액 합계 '+won(tot)+'</div>'+(h||'<p class="mu">환자가 없어요. 위에서 추가해 주세요.</p>');
}
function addPats(){
 var n=$("#pb").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
 n.forEach(function(x){S.patients.push({id:uid("p"),ward:ward,name:x})});save();render();
}
function editPat(id){
 var p=P(id);
 $("#md").innerHTML='<div class="ov"><div class="sheet"><h3>환자 정보 수정</h3><div class="row" style="margin-top:10px"><input id="mn" value="'+esc(p.name)+'"><select id="mw">'+[2,3,4,5].map(function(w){return '<option value="'+w+'"'+(w==p.ward?" selected":"")+'>'+w+'병동</option>'}).join("")+'</select></div><div class="acts"><button class="pri" id="ms">저장</button><button onclick="closeM()">취소</button></div></div></div>';
 $("#ms").onclick=function(){var n=$("#mn").value.trim();if(!n)return;p.name=n;p.ward=+$("#mw").value;ward=p.ward;save();closeM();render()};
}
function delPat(id){var p=P(id);ask("환자 삭제",esc(p.name)+"님의 출석과 지출 기록이 모두 삭제되며 되돌릴 수 없어요.",[["삭제","dng",function(){S.patients=S.patients.filter(function(x){return x.id!=id});delete S.att[id];S.exp=S.exp.filter(function(e){return e.pid!=id});if(pid==id)pid=null;save();closeM();render()}],["취소","",closeM]])}
function vCal(){
 var s=stats(pid,Y,M),a=S.att[pid]||{},first=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate(),h="",xs={};
 S.exp.forEach(function(e){if(e.pid==pid)xs[e.date]=(xs[e.date]||0)+e.amt});
 DW.forEach(function(d){h+='<div class="dow">'+d+'</div>'});
 for(var i=0;i<first;i++)h+='<div class="day e"></div>';
 var tk=key(now.getFullYear(),now.getMonth(),now.getDate());
 for(var d=1;d<=n;d++){var k=key(Y,M,d),x=xs[k]||0,c="",dw=(first+d-1)%7,hn=HOL[k],off=dw==0||dw==6||hn;
  nv(a[k]).forEach(function(e){c+='<i class="c'+(e.a>=200?2:1)+'">+'+e.a+'</i>'});
  if(x)c+='<u>−'+x+'</u>';
  h+='<button class="day'+(off?" off":"")+(k==tk?" today":"")+'" onclick="pick(\''+k+'\')"><div class="dh"><span>'+d+'</span>'+(hn?'<em class="hn">'+hn+'</em>':'')+'</div><div class="it">'+c+'</div></button>'}
 return wtabs("selW")+hdr()+nav()+'<div class="card">'+summary(s)+'</div><div class="card"><div class="cal">'+h+'</div><div class="lg"><span><b style="background:var(--a1)"></b>+100원</span><span><b style="background:var(--bl)"></b>+200원</span><span><b style="border:1px solid var(--dn)"></b>−지출</span><span><b style="background:var(--rd)"></b>토·일·공휴일</span></div><p class="mu" style="margin:8px 0 0">날짜를 누르면 적립을 기록해요. 하루에 여러 번 추가할 수 있어요.</p></div>'+expCard(s);
}
function ent(id,k){return nv((S.att[id]||{})[k])}
function pick(k){
 var es=ent(pid,k),tot=0,xs=S.exp.filter(function(e){return e.pid==pid&&e.date==k}),hn=HOL[k];

function vGift(){
 var all=S.exp.filter(function(x){return x.date==gd&&P(x.pid)}),
 L=all.filter(function(x){return !gw||P(x.pid).ward==gw}).sort(function(a,b){var pa=P(a.pid),pb=P(b.pid);return pa.ward-pb.ward||pa.name.localeCompare(pb.name,"ko")}),
 tot=0,dn=0,g={};
 L.forEach(function(x){tot+=x.amt;if(x.done)dn++;var m=x.memo||"(항목 없음)",o=g[m]=g[m]||{n:0,a:0,d:0};o.n++;o.a+=x.amt;if(x.done)o.d++});
 var wb=[0,2,3,4,5].map(function(w){var c=all.filter(function(x){return !w||P(x.pid).ward==w}).length;return '<button class="'+(w==gw?"pri":"")+'" onclick="gw='+w+';render()" style="padding:10px 2px">'+(w?w+"병동":"전체")+'<br><small>'+c+'건</small></button>'}).join("");
 var rows=L.map(function(x){var p=P(x.pid);return '<label class="gi'+(x.done?" dn":"")+'"><input type="checkbox"'+(x.done?" checked":"")+' onchange="giveT(\''+x.id+'\')"><div><b class="gn">'+esc(p.name)+'</b> <small>'+p.ward+'병동</small><div class="gn">'+esc(x.memo||"(항목 없음)")+'</div>'+(x.done?'<small>지급 '+(x.dt||"")+'</small>':'')+'</div><b>'+won(x.amt)+'</b></label>'}).join("");
 var gr=Object.keys(g).map(function(m){return '<tr><td>'+esc(m)+'</td><td>'+g[m].d+'/'+g[m].n+'건</td><td>'+won(g[m].a)+'</td></tr>'}).join("");
 return '<div class="nav"><button onclick="gsh(-1)" aria-label="전날">‹</button><div style="text-align:center"><b style="font-size:18px">'+gd.replace(/-/g,".")+' ('+DW[new Date(gd+"T00:00:00").getDay()]+')</b><div><button class="sm" onclick="gd=key(now.getFullYear(),now.getMonth(),now.getDate());render()">오늘</button></div></div><button onclick="gsh(1)" aria-label="다음날">›</button></div>'+
 '<div class="row" style="grid-template-columns:repeat(5,1fr)">'+wb+'</div>'+
 '<div class="card"><div class="st"><div><small>주문</small><b>'+L.length+'건</b></div><div><small>지급 완료</small><b class="bal">'+dn+'건</b></div><div><small>미지급</small><b style="color:var(--dn)">'+(L.length-dn)+'건</b></div><div><small>합계 금액</small><b>'+won(tot)+'</b></div></div></div>'+
 '<div class="card"><b>주문 목록</b><p class="mu" style="margin:2px 0">물건을 전달하면 체크하세요.</p>'+(rows||'<p class="mu">이 날 주문한 물품이 없어요. 달력 화면 아래에서 지출(물품 구매)을 등록하면 여기에 나타나요.</p>')+'</div>'+
 (gr?'<div class="card"><b>품목별 합계</b><div class="tw"><table class="tb"><tr><th>물품</th><th>지급/주문</th><th>금액</th></tr>'+gr+'</table></div></div>':'');
}
function wst(w){var r={n:0,att:0,carry:0,rew:0,sp:0,bal:0,c1:0,c2:0,ta:0,te:0};pats(w).forEach(function(p){var s=stats(p.id,Y,M);r.n++;if(s.days)r.att++;["carry","rew","sp","bal","c1","c2","ta","te"].forEach(function(f){r[f]+=s[f]})});return r}
function vStat(){
 var sw='<div class="wt" style="grid-template-columns:1fr 1fr"><button class="'+(sv=="w"?"on":"")+'" onclick="sv=\'w\';render()">병동별</button><button class="'+(sv=="p"?"on":"")+'" onclick="sv=\'p\';render()">환자별</button></div>';
 return sw+(sv=="w"?vStatW():wtabs("selW")+(P(pid)?vStatP():noP()));
}
function vStatW(){
 var g=function(l,v,c){return '<div><small>'+l+'</small><b class="'+(c||"")+'">'+v+'</b></div>'},T={n:0,carry:0,rew:0,sp:0,bal:0};
 var rows=[2,3,4,5].map(function(w){var r=wst(w);["n","carry","rew","sp","bal"].forEach(function(f){T[f]+=r[f]});return '<tr><td>'+w+'병동 ('+r.n+'명)</td><td>'+won(r.carry)+'</td><td>'+won(r.rew)+'</td><td>'+won(r.sp)+'</td><td class="bal">'+won(r.bal)+'</td></tr>'}).join("");
 var r=wst(ward),pr=pats(ward).map(function(p){var s=stats(p.id,Y,M);return '<tr><td>'+esc(p.name)+'</td><td>'+won(s.rew)+'</td><td>'+won(s.sp)+'</td><td class="bal">'+won(s.bal)+'</td></tr>'}).join("");
 return nav()+'<div class="card"><b>'+(M+1)+'월 병동별 합계</b><div class="tw"><table class="tb"><tr><th>병동</th><th>이월</th><th>적립</th><th>지출</th><th>잔액</th></tr>'+rows+'<tr class="tot"><td>전체 ('+T.n+'명)</td><td>'+won(T.carry)+'</td><td>'+won(T.rew)+'</td><td>'+won(T.sp)+'</td><td>'+won(T.bal)+'</td></tr></table></div></div>'+
 wtabs("selW")+'<div class="card"><b>'+ward+'병동 상세</b><div class="st" style="margin-top:8px">'+g("출석한 환자",r.att+"명 / "+r.n+"명")+g("100원 / 200원 횟수",r.c1+"회 / "+r.c2+"회")+g("이번 달 적립",won(r.rew))+g("이번 달 지출",won(r.sp))+g("누적 적립",won(r.ta))+g("누적 지출",won(r.te))+'</div></div>'+
 '<div class="card"><b>'+ward+'병동 환자별 ('+(M+1)+'월)</b><div class="tw"><table class="tb"><tr><th>이름</th><th>적립</th><th>지출</th><th>잔액</th></tr>'+(pr||'<tr><td colspan="4">환자가 없어요</td></tr>')+'</table></div></div>';
}
function vStatP(){
 var s=stats(pid,Y,M),g=function(l,v,c){return '<div><small>'+l+'</small><b class="'+(c||"")+'">'+v+'</b></div>'};
 return hdr()+nav()+'<div class="card"><b>'+(M+1)+'월</b><div class="st" style="margin-top:8px">'+g("출석 일수",s.days+"일")+g("100원 횟수",s.c1+"회")+g("200원 횟수",s.c2+"회")+g("총 적립액",won(s.rew))+g("총 지출액",won(s.sp))+g("이월금액",won(s.carry))+g("현재 잔액",won(s.bal),"bal")+'</div></div>'+
 '<div class="card"><b>전체 누적</b><div class="st" style="margin-top:8px">'+g("누적 적립액",won(s.ta))+g("누적 지출액",won(s.te))+'</div></div>';
}
function vSet(){
 return '<div class="card"><b>CSV 백업</b><p class="mu">전체 병동의 환자, 적립, 지출(지급 여부 포함)이 CSV로 담겨요. 엑셀에서 열어 볼 수 있어요.</p><textarea id="bt" readonly></textarea><div class="acts" style="margin-top:8px"><button class="pri" onclick="copyB()">복사</button><button onclick="dlB()">CSV 파일로 저장</button></div><div id="bm" class="mu" style="margin-top:6px"></div></div>'+
 '<div class="card"><b>CSV 복원</b><p class="mu">CSV 파일을 선택하거나 내용을 붙여넣으세요. 환자ID가 비어 있으면 병동+이름으로 맞춰요. 적용 전에 덮어쓰기/합치기를 선택하고 확인해요.</p><input type="file" id="bf" accept=".csv,text/csv" style="margin-bottom:8px"><textarea id="rt" placeholder="여기에 CSV 붙여넣기"></textarea><button class="pri" style="margin-top:8px" onclick="restore($(\'#rt\').value)">복원하기</button><div id="rm" class="mu" style="color:var(--dn);margin-top:6px"></div></div>'+
 '<div class="card"><b>데이터 초기화</b><p class="mu">모든 환자와 기록이 삭제돼요. 먼저 백업해 두세요.</p><button class="dng" onclick="reset()">전체 초기화</button></div>'+
 '<div class="card mu">앱 버전 1.4.0 · 통화 원(KRW) · 공휴일 2025~2027년 · 데이터는 이 기기에 자동 저장돼요.</div>';
}
function csvq(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(){
 var L=[["구분","환자ID","병동","이름","날짜","금액","메모","지급"]];
 S.patients.forEach(function(p){L.push(["환자",p.id,p.ward,p.name,"","","",""])});
 S.patients.forEach(function(p){var a=S.att[p.id]||{};Object.keys(a).sort().forEach(function(k){nv(a[k]).forEach(function(e){L.push(["적립",p.id,p.ward,p.name,k,e.a,"",""])})})});
 S.exp.forEach(function(e){var p=P(e.pid)||{};L.push(["지출",e.pid,p.ward||"",p.name||"",e.date,e.amt,e.memo||"",e.done?"지급완료":""])});
 return L.map(function(r){return r.map(csvq).join(",")}).join("\n");
}
function parseCSV(t){
 t=t.replace(/^\uFEFF/,"");var R=[],r=[],f="",qt=false;
 for(var i=0;i<t.length;i++){var c=t[i];
  if(qt){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else qt=false}else f+=c}
  else if(c=='"')qt=true;
  else if(c==","){r.push(f);f=""}
  else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";R.push(r);r=[]}
  else f+=c}
 if(f!==""||r.length){r.push(f);R.push(r)}
 return R.filter(function(x){return x.some(function(y){return y.trim()!==""})});
}
function nd(s){var m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec((s||"").trim());return m?m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]):null}
function bk(){
 var t=$("#bt");if(t)t.value=toCSV();
 var f=$("#bf");if(f)f.onchange=function(){var r=new FileReader();r.onload=function(){restore(r.result)};if(f.files[0])r.readAsText(f.files[0])};
}
function copyB(){var t=$("#bt");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#bm").textContent=ok?"복사했어요.":"선택된 내용을 길게 눌러 복사하세요."}
function dlB(){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+$("#bt").value],{type:"text/csv;charset=utf-8"}));a.download="attendance-backup-"+key(now.getFullYear(),now.getMonth(),now.getDate())+".csv";document.body.appendChild(a);a.click();a.remove();$("#bm").textContent="저장을 시도했어요. 안 되면 복사 버튼을 사용하세요."}catch(e){$("#bm").textContent="이 환경에서는 파일 저장이 막혀 있어요. 복사 버튼을 사용하세요."}}
function restore(txt){
 var R=parseCSV(txt),rm=$("#rm"),H={};
 if(R.length)R[0].forEach(function(h,i){H[h.trim()]=i});
 if(!R.length||H["구분"]==null){if(rm)rm.textContent="올바른 CSV가 아니에요. 첫 줄은 구분,환자ID,병동,이름,날짜,금액,메모,지급 형식이어야 해요.";return}
 var c=function(r,n){return H[n]==null?"":(r[H[n]]||"")};
 var ip=[],byId={},byN={},att={},ex=[],bad=0,na=0;
 function get(id,w,n){id=(id||"").trim();n=(n||"").trim();w=parseInt(w,10);var nk=w+"|"+n;
  if(id&&byId[id])return byId[id];if(byN[nk])return byN[nk];
  if(!n||!(w>=2&&w<=5))return null;
  var p={id:id||uid("p"),ward:w,name:n};ip.push(p);byId[p.id]=p;byN[nk]=p;return p}
 for(var i=1;i<R.length;i++){var r=R[i],ty=c(r,"구분").trim(),p=get(c(r,"환자ID"),c(r,"병동"),c(r,"이름"));
  if(ty=="환자"){if(!p)bad++;continue}
  var d=nd(c(r,"날짜")),a=parseInt(c(r,"금액"),10);
  if(!p||!d||!(a>0)){bad++;continue}
  if(ty=="적립"){((att[p.id]=att[p.id]||{})[d]=att[p.id][d]||[]).push({a:a});na++}
  else if(ty=="지출"){var dn=c(r,"지급").trim()=="지급완료";ex.push({id:uid("e"),pid:p.id,date:d,amt:a,memo:c(r,"메모").trim(),done:dn,dt:""})}
  else bad++}
 ask("복원 방식 선택","CSV에는 환자 "+ip.length+"명, 적립 "+na+"건, 지출 "+ex.length+"건이 있어요."+(bad?" 읽지 못한 "+bad+"줄은 건너뛰어요.":"")+"<br><b>덮어쓰기</b>: 현재 데이터를 모두 지우고 CSV로 교체<br><b>합치기</b>: 현재 데이터를 유지하고 CSV를 추가 (같은 날짜 적립은 CSV 값 우선)",[
 ["덮어쓰기","dng",function(){S={patients:ip,att:att,exp:ex};pid=null;save();closeM();render()}],
 ["합치기","pri",function(){
  var map={};ip.forEach(function(p){var e=S.patients.filter(function(x){return x.id==p.id||(x.ward==p.ward&&x.name==p.name)})[0];if(e)map[p.id]=e.id;else{S.patients.push(p);map[p.id]=p.id}});
  for(var id in att){var t=S.att[map[id]]=S.att[map[id]]||{};for(var k in att[id])t[k]=att[id][k]}
  var sk={};S.exp.forEach(function(e){sk[e.pid+"|"+e.date+"|"+e.amt+"|"+e.memo]=1});
  ex.forEach(function(e){e.pid=map[e.pid];var kk=e.pid+"|"+e.date+"|"+e.amt+"|"+e.memo;if(!sk[kk]){sk[kk]=1;S.exp.push(e)}});
  save();closeM();render()}],
 ["취소","",closeM]]);
}
function reset(){ask("전체 초기화","모든 환자와 기록이 삭제되며 되돌릴 수 없어요. 정말 초기화할까요?",[["초기화","dng",function(){S={patients:[],att:{},exp:[]};pid=null;save();closeM();render()}],["취소","",closeM]])}
render();
